[project]
name = "sleek-relay-voice-worker"
version = "0.1.0"
description = "Local Pipecat voice-worker proof of concept for the Sleek Relay validation demo."
requires-python = ">=3.12,<3.14"
dependencies = [
    "pipecat-ai[runner,webrtc,deepgram,google,cartesia]==1.7.0",
    "python-dotenv>=1.0.0,<2.0.0",
]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[dependency-groups]
dev = [
    "pytest>=9.1.1",
]
